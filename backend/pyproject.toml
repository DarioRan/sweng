[project]
name = "repair-assistant-backend"
version = "0.1.0"
description = "Service layer for the vision-grounded repair assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
