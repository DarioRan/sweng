name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (backend · ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check backend present
        id: guard
        run: test -d backend && echo "present=true" >> $GITHUB_OUTPUT || echo "present=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff check
        if: steps.guard.outputs.present == 'true'
        working-directory: backend
        run: ruff check .

  # ── Stage 2: Type check ────────────────────────────────────────────────────
  typecheck:
    name: Type check (frontend · tsc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check frontend present
        id: guard
        run: test -d frontend && echo "present=true" >> $GITHUB_OUTPUT || echo "present=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck

  # ── Stage 3: Test ──────────────────────────────────────────────────────────
  test-backend:
    name: Test (backend · pytest)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check backend present
        id: guard
        run: test -d backend && echo "present=true" >> $GITHUB_OUTPUT || echo "present=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: pytest
        if: steps.guard.outputs.present == 'true'
        working-directory: backend
        run: pytest

  test-frontend:
    name: Test (frontend · Vitest)
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check frontend present
        id: guard
        run: test -d frontend && echo "present=true" >> $GITHUB_OUTPUT || echo "present=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Vitest
        if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: npm test
